<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nourhan Nabil | إدارة الطلاب</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#34243d;background:#faf7fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:linear-gradient(160deg,#692d75,#a44e8f);color:white;padding:24px 14px;flex-shrink:0}.brand{font-weight:900;font-size:23px;padding:12px 10px 28px;direction:ltr;text-align:center}.brand small{display:block;font-size:11px;font-weight:400;opacity:.8;letter-spacing:2px}.nav{width:100%;display:block;background:transparent;color:#fff;text-align:right;padding:13px 15px;border-radius:12px;margin:3px 0}.nav.active,.nav:hover{background:#ffffff29}.main{flex:1;min-width:0;padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.top h1{margin:0;font-size:25px}.muted{color:#8a7990;font-size:13px}.card{background:#fff;border:1px solid #f0e5f0;border-radius:18px;padding:19px;box-shadow:0 5px 25px #5c26500b;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.stat{font-size:28px;font-weight:800;color:#9b3d84;margin-top:12px}.btn{padding:10px 16px;border-radius:10px;background:#a3448b;color:#fff;font-weight:700}.btn.alt{background:#f5e9f4;color:#80376e}.btn.danger{background:#fce6e8;color:#b21d3b}.btn.sm{padding:6px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700;color:#67516c}.field input,.field select,input.search{border:1px solid #e6d8e8;border-radius:10px;padding:11px;background:#fff;min-width:0;width:100%;outline-color:#b35b9e}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:15px 0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:right}td,th{padding:13px;border-bottom:1px solid #f3eaf2;font-size:13px}th{color:#8d6f8e;background:#fdf9fd}.pill{display:inline-block;border-radius:30px;padding:5px 9px;background:#f5e7f2;color:#8d3579;font-size:12px}.ok{background:#e7f8ed;color:#207546}.bad{background:#fff0ef;color:#ad4252}.tile{padding:25px 14px;border:1px solid #ead9e9;background:#fff;border-radius:15px;text-align:center;font-weight:800;color:#773b79}.tile:hover,.tile.selected{background:#f5e2f1;border-color:#bc72aa}.tile .emoji{font-size:28px;display:block;margin-bottom:10px}.groupcard{border:1px solid #eddfec;border-radius:14px;padding:17px;background:#fff}.groupcard h3{margin:0 0 10px}.empty{text-align:center;padding:35px;color:#9a829e}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#f9d4e9,transparent 55%),#f9f6fb}.auth .card{width:min(100%,430px)}.auth h1{text-align:center;color:#8e3e82}.notice{background:#fff6e6;border:1px solid #f5dbad;padding:13px;border-radius:12px;font-size:13px;line-height:1.8;margin:12px 0}.breadcrumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}.link{color:#963e85;background:transparent;padding:5px;font-weight:700}.status{font-size:12px;color:#817187}.checkrow{display:flex;align-items:center;gap:10px}.checkrow input{width:20px;height:20px;accent-color:#a3448b}dialog{border:0;border-radius:18px;max-width:600px;width:calc(100% - 24px);padding:24px;box-shadow:0 20px 100px #2e163c55}dialog::backdrop{background:#24132b80}dialog h2{margin-top:0}.footer{margin-top:20px;font-size:11px;color:#9c8b9f;text-align:center}@media(max-width:750px){.app{display:block}.sidebar{width:100%;padding:10px;position:sticky;top:0;z-index:5}.brand{padding:6px;font-size:18px}.brand small{display:none}.navs{display:flex;overflow-x:auto;gap:3px}.nav{white-space:nowrap;font-size:12px;padding:10px}.main{padding:14px}.top h1{font-size:21px}}
</style></head><body>
<div id="auth" class="auth"><div class="card"><h1>✿ Nourhan Nabil</h1><p class="muted" style="text-align:center">نظام إدارة الطلاب والحصص والاشتراكات</p><div id="setupNotice" class="notice hidden">يجب إكمال إعداد Firebase أولًا. راجع ملف README.md لإعداد التطبيق وقواعد الأمان.</div><form id="loginForm"><div class="formgrid" style="grid-template-columns:1fr"><label class="field">الرمز السري المشترك<input type="password" id="password" minlength="6" required autocomplete="current-password" placeholder="اكتب الرمز السري"></label></div><button class="btn" style="width:100%">دخول المنصة</button></form><p id="loginMsg" class="muted"></p></div></div>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand">Nourhan Nabil<small>STUDENT MANAGEMENT</small></div><div class="navs" id="navs"><button class="nav active" data-page="dashboard">◈ الرئيسية</button><button class="nav" data-page="students">♙ الطلاب</button><button class="nav" data-page="groups">▦ المجموعات</button><button class="nav" data-page="lessons">▣ الحصص والغياب</button><button class="nav" data-page="payments">◉ المدفوعات</button><button class="nav" data-page="settings">⚙ الإعدادات والاشتراكات</button></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">لوحة التحكم</h1><span class="muted" id="subtitle">متابعة كل ما يخص الطلاب في مكان واحد</span></div><div class="actions"><span id="userLabel" class="status"></span><button class="btn alt sm" id="logout">خروج</button></div></div><div id="content"></div><div class="footer">جميع الحقوق محفوظة لـ <a href="https://wa.me/201505891804" target="_blank" rel="noopener noreferrer" style="color:#963e85;font-weight:700;text-decoration:underline;text-underline-offset:3px">علي محمد</a> • نورهان نبيل</div></main></div>
<dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn alt" id="closeModal">إلغاء</button><button class="btn" id="saveModal">حفظ</button></div></dialog>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection as fsCollection, doc as fsDoc, getDoc, setDoc as fsSetDoc, updateDoc as fsUpdateDoc, deleteDoc as fsDeleteDoc, addDoc as fsAddDoc, onSnapshot, runTransaction as fsTransaction, writeBatch } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { firebaseConfig, SHARED_LOGIN_EMAIL, ALLOWED_UID } from './firebase-config.js';
// Cloud version: Firestore is the source of truth. PIN is NEVER embedded in files.

const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),grades=['أولى ثانوي','تانية ثانوي','تالتة ثانوي'],money=n=>Number(n||0).toLocaleString('ar-EG'),date=()=>new Date().toLocaleDateString('en-CA'),month=()=>date().slice(0,7);
let db=null, auth=null, uid=null,page='dashboard',gradePick=0,groupPick=null,lessonPick=null,studentPick=null,search='',role='owner';
const keys=['students','groups','lessons','payments','fees','attendance','makeups'];
let state=Object.fromEntries(keys.map(k=>[k,[]]));
let unsubscribers=[];
const collection=(database,name)=>fsCollection(database,name);
const doc=(parent,name,id)=>{
 if(typeof parent==='object'&&parent.type==='collection')return name?fsDoc(parent,name):fsDoc(parent);
 return fsDoc(parent,name,id);
};
const serverTimestamp=()=>new Date().toISOString();
async function addDoc(ref,data){return fsAddDoc(ref,data)}
async function setDoc(ref,data){return fsSetDoc(ref,data,{merge:true})}
async function updateDoc(ref,data){return fsUpdateDoc(ref,data)}
async function deleteDoc(ref){return fsDeleteDoc(ref)}
async function createStudent(d){
 const counter=fsDoc(db,'meta','studentCounter');
 await fsTransaction(db,async t=>{
   const snap=await t.get(counter),next=Number(snap.exists()?snap.data().last:0)+1;
   const studentRef=fsDoc(fsCollection(db,'students'));
   t.set(counter,{last:next});
   t.set(studentRef,{...d,code:'138'+next,sequence:next,createdAt:serverTimestamp()});
 });
}
function stopListeners(){unsubscribers.forEach(fn=>fn());unsubscribers=[]}
function startListeners(){
 stopListeners();
 for(const key of keys){
  const unsub=onSnapshot(fsCollection(db,key),snap=>{
    state[key]=snap.docs.map(d=>({id:d.id,...d.data()}));render();
  },err=>{console.error(err);$('userLabel').textContent='خطأ في الاتصال أو الصلاحيات';alert('تعذر قراءة البيانات: '+err.message)});
  unsubscribers.push(unsub);
 }
}
function showLogin(message=''){$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('loginMsg').textContent=message}
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent='متصل بقاعدة البيانات السحابية';startListeners();render()}
$('loginForm').onsubmit=async e=>{
 e.preventDefault();$('loginMsg').textContent='جارٍ التحقق...';
 try{await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,SHARED_LOGIN_EMAIL,$('password').value);$('password').value=''}
 catch(err){$('loginMsg').textContent=err.code==='auth/invalid-credential'?'الرمز السري غير صحيح.':'تعذر تسجيل الدخول: '+err.message}
};
$('logout').textContent='تسجيل الخروج';
$('logout').onclick=async()=>{if(confirm('تسجيل الخروج من هذا الجهاز؟'))await signOut(auth)};
try{
 if(!firebaseConfig?.apiKey||!firebaseConfig?.projectId||!SHARED_LOGIN_EMAIL||!ALLOWED_UID)throw Error('أكمل إعداد firebase-config.js أولًا');
 const app=initializeApp(firebaseConfig);db=getFirestore(app);auth=getAuth(app);
 onAuthStateChanged(auth,async user=>{
   stopListeners();
   if(user&&user.uid===ALLOWED_UID){uid=user.uid;showApp()}
   else{uid=null;if(user)await signOut(auth);showLogin(user?'هذا الحساب غير مصرح له.':'')}
 });
}catch(err){$('setupNotice').classList.remove('hidden');showLogin('إعداد Firebase غير مكتمل: '+err.message);$('loginForm').querySelector('button').disabled=true}

$('closeModal').onclick=()=>$('modal').close();$('navs').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;gradePick=0;groupPick=null;lessonPick=null;studentPick=null;search='';render()}};
const title={dashboard:'لوحة التحكم',students:'إدارة الطلاب',groups:'إدارة المجموعات',lessons:'الحصص والحضور والغياب',payments:'الاشتراكات والمدفوعات',settings:'الإعدادات والرسوم الشهرية'};
function toast(msg){alert(msg)}function options(arr,selected){return arr.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(t)}</option>`).join('')}
function field(label,name,value='',type='text',required=true){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`}
function select(label,name,items,val){return `<label class="field">${label}<select name="${name}" required>${options(items,val)}</select></label>`}
function openModal(t,html,save){$('modalTitle').textContent=t;$('modalBody').innerHTML=`<form id="editForm"><div class="formgrid">${html}</div></form>`;$('saveModal').onclick=async()=>{const form=$('editForm');if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));$('saveModal').disabled=true;try{await save(data);$('modal').close()}catch(e){toast('تعذر الحفظ: '+e.message)}finally{$('saveModal').disabled=false}};$('modal').showModal()}
const groupsFor=g=>state.groups.filter(x=>Number(x.grade)===Number(g)),groupName=id=>{let g=state.groups.find(x=>x.id===id);return g?`${g.center} — ${g.days} (${g.time})`:'غير محدد'},studentName=id=>state.students.find(s=>s.id===id)?.name||'طالب محذوف',feeFor=g=>Number(state.fees.find(f=>f.id==='grade'+g)?.amount||0),sumPaid=(sid,m)=>state.payments.filter(p=>p.studentId===sid&&p.month===m).reduce((a,p)=>a+Number(p.amount||0),0),paidLabel=(s,m)=>{const fee=feeFor(s.grade),p=sumPaid(s.id,m);return !fee?'لم يحدد الاشتراك':p>=fee?'مدفوع':p>0?'دفع جزئي':'لم يدفع'};
function render(){if(!uid)return;$('pageTitle').textContent=title[page];document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const views={dashboard:dashboard,students:students,groups:groups,lessons:lessons,payments:payments,settings:settings};$('content').innerHTML=views[page]();bind()}
function dashboard(){const m=month(),unpaid=state.students.filter(s=>feeFor(s.grade)>sumPaid(s.id,m)).length,today=date();return `<div class="grid"><div class="card">إجمالي الطلاب<div class="stat">${state.students.length}</div></div><div class="card">المجموعات<div class="stat">${state.groups.length}</div></div><div class="card">حصص اليوم<div class="stat">${state.lessons.filter(l=>l.date===today).length}</div></div><div class="card">طلاب عليهم مستحقات هذا الشهر<div class="stat">${unpaid}</div></div></div><div class="card"><h3>مرحبًا في Nourhan Nabil ✿</h3><p class="muted">ابدئي بإضافة المجموعات وتحديد اشتراك كل صف، ثم سجلي الطلاب. من قسم الحصص يمكن فتح الصف، ثم المجموعة، ثم تسجيل الحضور والتعويضات.</p><div class="actions"><button class="btn" data-go="students">إدارة الطلاب</button><button class="btn alt" data-go="lessons">فتح الحصص</button><button class="btn alt" data-go="settings">أسعار الاشتراكات</button></div></div>`}
function students(){let list=state.students.filter(s=>(s.name+' '+s.code+' '+groupName(s.groupId)).toLowerCase().includes(search.toLowerCase()));return `<div class="card"><div class="actions" style="justify-content:space-between"><input class="search" id="search" style="max-width:340px" placeholder="ابحث بالاسم أو المعرف أو المجموعة" value="${esc(search)}"><button class="btn" data-act="newStudent">+ إضافة طالب</button></div></div><div class="card tablewrap"><table><thead><tr><th>المعرف</th><th>الاسم</th><th>الصف</th><th>المجموعة الأساسية</th><th>اشتراك الشهر</th><th>إجراءات</th></tr></thead><tbody>${list.map(s=>`<tr><td><b>${esc(s.code)}</b></td><td>${esc(s.name)}</td><td>${grades[s.grade]}</td><td>${esc(groupName(s.groupId))}</td><td><span class="pill ${paidLabel(s,month())==='مدفوع'?'ok':'bad'}">${paidLabel(s,month())}</span></td><td><button class="btn alt sm" data-act="editStudent" data-id="${s.id}">ملف الطالب</button> <button class="btn danger sm" data-act="deleteStudent" data-id="${s.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا يوجد طلاب</td></tr>'}</tbody></table></div>`}
function groups(){return `<div class="actions" style="margin-bottom:16px"><button class="btn" data-act="newGroup">+ إضافة مجموعة</button></div><div class="grid">${grades.map((g,i)=>`<button class="tile ${gradePick===i?'selected':''}" data-grade="${i}"><span class="emoji">🎓</span>${g}<div class="muted">${groupsFor(i).length} مجموعات</div></button>`).join('')}</div><h3>مجموعات ${grades[gradePick]}</h3><div class="grid">${groupsFor(gradePick).map(g=>`<div class="groupcard"><h3>${esc(g.center)}</h3><p class="muted">${esc(g.days)} • ${esc(g.time)}</p><p class="muted">${state.students.filter(s=>s.groupId===g.id).length} طالب</p><button class="btn alt sm" data-act="editGroup" data-id="${g.id}">تعديل المجموعة</button> <button class="btn danger sm" data-act="deleteGroup" data-id="${g.id}">حذف المجموعة</button></div>`).join('')||'<div class="empty">لا توجد مجموعات لهذا الصف</div>'}</div>`}
function lessons(){if(lessonPick){const l=state.lessons.find(x=>x.id===lessonPick);if(!l){lessonPick=null;return lessons()}const g=state.groups.find(x=>x.id===l.groupId);const regular=state.students.filter(s=>s.groupId===l.groupId),makeups=state.makeups.filter(m=>m.targetLessonId===l.id),ids=[...new Set([...regular.map(s=>s.id),...makeups.map(m=>m.studentId)])];return `<div class="breadcrumb"><button class="link" data-back="grades">الصفوف</button> ‹ <button class="link" data-back="groups">المجموعات</button> ‹ الحضور</div><div class="card"><h3>${esc(g?.center)} — ${esc(l.date)}</h3><p class="muted">${esc(l.topic||'حصة دراسية')} • ${esc(g?.days||'')}</p><div class="actions">${l.closed?`<span class="pill">✓ الحصة منتهية ومحفوظة في السجل</span><button class="btn alt" data-act="reopenLesson" data-id="${l.id}">إعادة فتح الحصة</button>`:`<button class="btn" data-act="makeup" data-id="${l.id}">+ إضافة طالب تعويض</button><button class="btn danger" data-act="finishLesson" data-id="${l.id}">✓ إنهاء الحصة وحفظها</button>`}</div></div><div class="card tablewrap"><table><thead><tr><th>الطالب</th><th>المعرف</th><th>النوع</th><th>الحضور</th></tr></thead><tbody>${ids.map(id=>{const s=state.students.find(x=>x.id===id),a=state.attendance.find(x=>x.id===l.id+'_'+id),m=makeups.find(x=>x.studentId===id);return `<tr><td>${esc(s?.name)}</td><td>${esc(s?.code)}</td><td>${m?'<span class="pill">تعويض</span>':'أساسي'}</td><td><div class="actions"><button ${l.closed?"disabled title=\"الحصة منتهية\"":""} class="btn sm ${a?.status==='present'?'':'alt'}" data-att="present" data-student="${id}">حاضر</button><button ${l.closed?"disabled title=\"الحصة منتهية\"":""} class="btn sm ${a?.status==='absent'?'danger':'alt'}" data-att="absent" data-student="${id}">غائب</button><button ${l.closed?"disabled title=\"الحصة منتهية\"":""} class="btn sm alt" data-att="clear" data-student="${id}">لم يسجل</button></div></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">لا يوجد طلاب</td></tr>'}</tbody></table></div>`}
if(groupPick){const g=state.groups.find(x=>x.id===groupPick);if(!g){groupPick=null;return lessons()}return `<div class="breadcrumb"><button class="link" data-back="grades">الصفوف</button> ‹ <button class="link" data-back="groups">مجموعات ${grades[gradePick]}</button> ‹ ${esc(g.center)}</div><div class="card"><div class="actions" style="justify-content:space-between"><div><h3>${esc(g.center)}</h3><p class="muted">${esc(g.days)} — ${esc(g.time)}</p></div><button class="btn" data-act="newLesson">+ حصة جديدة</button></div></div><div class="grid">${state.lessons.filter(l=>l.groupId===groupPick).sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<div class="groupcard"><h3>${esc(l.date)}</h3><p class="muted">${esc(l.topic||'حصة دراسية')}</p><p class="muted">${l.closed?"✓ منتهية — في سجل المجموعة":"● حصة مفتوحة"}</p><button class="btn alt sm" data-lesson="${l.id}">${l.closed?"عرض سجل الحصة ←":"فتح كشف الحضور ←"}</button> <button class="btn danger sm" data-act="deleteLesson" data-id="${l.id}">حذف الحصة</button></div>`).join('')||'<div class="empty">لا توجد حصص بعد</div>'}</div>`}
return `<div class="grid">${grades.map((g,i)=>`<button class="tile ${gradePick===i?'selected':''}" data-grade="${i}"><span class="emoji">🎓</span>${g}</button>`).join('')}</div><h3>مجموعات ${grades[gradePick]}</h3><div class="grid">${groupsFor(gradePick).map(g=>`<button class="tile" data-group="${g.id}"><span class="emoji">📚</span>${esc(g.center)}<div class="muted">${esc(g.days)} • ${esc(g.time)}</div></button>`).join('')||'<div class="empty">أضيفي مجموعة من قسم المجموعات أولًا</div>'}</div>`}
function payments(){const m=window.paymentMonth||month();const rows=state.students.map(s=>{const due=feeFor(s.grade),paid=sumPaid(s.id,m);return `<tr><td>${esc(s.code)}</td><td>${esc(s.name)}</td><td>${grades[s.grade]}</td><td>${money(due)}</td><td>${money(paid)}</td><td><span class="pill ${due&&paid>=due?'ok':'bad'}">${due?paid>=due?'مدفوع':paid>0?'جزئي':'لم يدفع':'غير محدد'}</span></td><td><button class="btn alt sm" data-act="pay" data-id="${s.id}">تسجيل دفعة</button><button class="btn alt sm" data-act="history" data-id="${s.id}">السجل</button></td></tr>`});return `<div class="card actions"><label class="field">شهر الاشتراك<input id="paymentMonth" type="month" value="${esc(m)}"></label><span class="muted">يتم احتساب ما دُفع خلال الشهر المختار</span></div><div class="card tablewrap"><table><thead><tr><th>المعرف</th><th>الطالب</th><th>الصف</th><th>المطلوب</th><th>المدفوع</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="7">لا يوجد طلاب</td></tr>'}</tbody></table></div>`}
function settings(){return `<div class="card"><h3>قيمة الاشتراك الشهري لكل صف</h3><p class="muted">الأسعار بالجنيه المصري. التعديل يغيّر المبلغ المعروض للأشهر كلها في هذا الإصدار؛ المدفوعات المسجلة لا تتغير.</p><div class="grid">${grades.map((g,i)=>`<div class="groupcard"><h3>${g}</h3><div class="stat">${money(feeFor(i))} ج.م</div><button class="btn alt sm" data-act="fee" data-id="${i}">تعديل السعر</button></div>`).join('')}</div></div><div class="card"><h3>الأمان والحسابات</h3><p class="muted">تسجيل الدخول برمز سري مشترك مرتبط بحساب Firebase Authentication واحد. كل من يعرف الرمز يمتلك الصلاحيات نفسها. لتغيير الرمز أو إلغاء وصول شخص، غيّري كلمة مرور الحساب من Firebase.</p></div>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{gradePick=Number(b.dataset.grade);groupPick=null;lessonPick=null;render()});document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{groupPick=b.dataset.group;render()});document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{lessonPick=b.dataset.lesson;render()});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(b.dataset.back==='grades'){groupPick=null;lessonPick=null}else lessonPick=null;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act,b.dataset.id));document.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>attendance(b.dataset.student,b.dataset.att));if($('search'))$('search').oninput=e=>{search=e.target.value;const pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)};if($('paymentMonth'))$('paymentMonth').onchange=e=>{window.paymentMonth=e.target.value;render()}}
function groupFields(g=-1,id=''){return select('الصف الدراسي','grade',grades.map((v,i)=>[i,v]),g)+select('المجموعة الأساسية','groupId',state.groups.filter(x=>g<0||Number(x.grade)===Number(g)).map(x=>[x.id,grades[x.grade]+' — '+groupName(x.id)]),id)}
async function action(a,id){
if(a==='deleteStudent'){
 const s=state.students.find(x=>x.id===id);if(!s)return;
 if(!confirm('حذف الطالب '+s.name+' ('+s.code+') نهائيًا؟\nسيتم حذف سجلات حضوره ومدفوعاته وتعويضاته أيضًا.'))return;
 try{const batch=writeBatch(db);
  batch.delete(fsDoc(db,'students',id));
  state.payments.filter(x=>x.studentId===id).forEach(x=>batch.delete(fsDoc(db,'payments',x.id)));
  state.attendance.filter(x=>x.studentId===id).forEach(x=>batch.delete(fsDoc(db,'attendance',x.id)));
  state.makeups.filter(x=>x.studentId===id).forEach(x=>batch.delete(fsDoc(db,'makeups',x.id)));
  await batch.commit();
 }catch(err){toast('تعذر الحذف: '+err.message)}return;
}
if(a==='deleteGroup'){
 const g=state.groups.find(x=>x.id===id);if(!g)return;
 if(state.students.some(x=>x.groupId===id)){toast('لا يمكن حذف المجموعة لأن بها طلابًا.');return}
 if(state.lessons.some(x=>x.groupId===id)){toast('احذفي حصص المجموعة أولًا.');return}
 if(state.makeups.some(x=>x.sourceGroupId===id)){toast('هناك سجلات تعويض مرتبطة بالمجموعة.');return}
 if(!confirm('حذف مجموعة '+g.center+' نهائيًا؟'))return;
 try{await deleteDoc(fsDoc(db,'groups',id))}catch(err){toast('تعذر الحذف: '+err.message)}return;
}
if(a==='deleteLesson'){
 const l=state.lessons.find(x=>x.id===id);if(!l)return;
 if(!confirm('حذف حصة '+l.date+' نهائيًا؟\nسيتم حذف كشف حضورها وتعويضاتها.'))return;
 try{const batch=writeBatch(db);
  batch.delete(fsDoc(db,'lessons',id));
  const related=state.makeups.filter(x=>x.targetLessonId===id||x.originalLessonId===id);
  related.forEach(x=>batch.delete(fsDoc(db,'makeups',x.id)));
  state.attendance.filter(x=>x.lessonId===id||x.makeupLessonId===id||related.some(m=>m.targetLessonId===id&&m.originalLessonId===x.lessonId&&m.studentId===x.studentId&&x.makeupLessonId===id)).forEach(x=>batch.delete(fsDoc(db,'attendance',x.id)));
  await batch.commit();if(lessonPick===id)lessonPick=null;
 }catch(err){toast('تعذر الحذف: '+err.message)}return;
}
if(a==='newGroup'||a==='editGroup'){const old=state.groups.find(x=>x.id===id)||{};openModal(old.id?'تعديل مجموعة':'إضافة مجموعة',field('اسم السنتر','center',old.center)+select('الصف','grade',grades.map((g,i)=>[i,g]),old.grade??gradePick)+field('الأيام (مثال: السبت والثلاثاء)','days',old.days)+field('الساعة (مثال: 8:00 صباحًا)','time',old.time),async d=>{if(old.id)await updateDoc(doc(db,'groups',old.id),{...d,grade:Number(d.grade)});else await addDoc(collection(db,'groups'),{...d,grade:Number(d.grade),createdAt:serverTimestamp()})});return}
if(a==='newStudent'||a==='editStudent'){const old=state.students.find(s=>s.id===id)||{};const extra=old.id?`<div class="notice" style="grid-column:1/-1">معرف الطالب: <b>${esc(old.code)}</b> — نقل المجموعة هنا دائم، ولا يحذف الحضور القديم.</div>`:'';openModal(old.id?'تعديل ملف الطالب':'إضافة طالب',extra+field('اسم الطالب','name',old.name)+select('الصف','grade',grades.map((g,i)=>[i,g]),old.grade??0)+select('المجموعة الأساسية','groupId',state.groups.map(g=>[g.id,grades[g.grade]+' — '+groupName(g.id)]),old.groupId)+field('رقم ولي الأمر (اختياري)','phone',old.phone,'tel',false),async d=>{const g=state.groups.find(x=>x.id===d.groupId);if(!g)throw Error('يجب إنشاء مجموعة واختيارها أولًا');d.grade=Number(g.grade);if(old.id)await updateDoc(doc(db,'students',old.id),d);else{await createStudent(d)}});return}
if(a==='finishLesson'){const l=state.lessons.find(x=>x.id===id);if(!l||l.closed)return;const g=state.groups.find(x=>x.id===l.groupId);const enrolled=state.students.filter(x=>x.groupId===l.groupId).map(x=>x.id);const guests=state.makeups.filter(x=>x.targetLessonId===l.id).map(x=>x.studentId);const ids=[...new Set([...enrolled,...guests])];const unmarked=ids.filter(sid=>!state.attendance.some(x=>x.id===l.id+'_'+sid));if(!confirm('إنهاء الحصة وحفظ كشف الحضور في سجل مجموعة '+(g?.center||'')+'؟'+(unmarked.length?'\nتنبيه: يوجد '+unmarked.length+' طالب لم يتم تسجيل حالته، وسيظل غير مسجل.':'')))return;await updateDoc(doc(db,'lessons',id),{closed:true,closedAt:serverTimestamp()});return}
if(a==='reopenLesson'){const l=state.lessons.find(x=>x.id===id);if(!l||!l.closed)return;if(!confirm('إعادة فتح الحصة لتعديل الحضور؟'))return;await updateDoc(doc(db,'lessons',id),{closed:false,closedAt:null});return}
if(a==='newLesson'){openModal('إضافة حصة جديدة',field('تاريخ الحصة','date',date(),'date')+field('عنوان الحصة','topic','حصة دراسية', 'text',false),async d=>{if(state.lessons.some(l=>l.groupId===groupPick&&l.date===d.date&&l.topic===d.topic))throw Error('هذه الحصة مسجلة بالفعل');await addDoc(collection(db,'lessons'),{...d,groupId:groupPick,createdAt:serverTimestamp()})});return}
if(a==='fee'){openModal('اشتراك '+grades[Number(id)],field('قيمة الاشتراك الشهري بالجنيه','amount',feeFor(Number(id)),'number'),async d=>{if(Number(d.amount)<0)throw Error('القيمة غير صحيحة');await setDoc(doc(db,'fees','grade'+id),{amount:Number(d.amount),grade:Number(id)})});return}
if(a==='pay'){const s=state.students.find(x=>x.id===id),m=window.paymentMonth||month();openModal('تسجيل دفعة — '+s.name,`<div style="grid-column:1/-1" class="notice">المطلوب ${money(feeFor(s.grade))} ج.م — المدفوع ${money(sumPaid(id,m))} ج.م</div>`+field('الشهر','month',m,'month')+field('المبلغ المدفوع بالجنيه','amount',Math.max(0,feeFor(s.grade)-sumPaid(id,m)),'number')+field('تاريخ الدفع','date',date(),'date'),async d=>{if(!(Number(d.amount)>0))throw Error('أدخلي مبلغًا أكبر من صفر');await addDoc(collection(db,'payments'),{...d,amount:Number(d.amount),studentId:id,recordedBy:uid,createdAt:serverTimestamp()})});return}
if(a==='history'){const s=state.students.find(x=>x.id===id);const p=state.payments.filter(x=>x.studentId===id).sort((a,b)=>b.date.localeCompare(a.date));openModal('سجل مدفوعات '+s.name,`<div style="grid-column:1/-1" class="tablewrap"><table><tr><th>الشهر</th><th>التاريخ</th><th>المبلغ</th></tr>${p.map(x=>`<tr><td>${esc(x.month)}</td><td>${esc(x.date)}</td><td>${money(x.amount)} ج.م</td></tr>`).join('')}</table></div>`,async()=>{});return}
if(a==='makeup'){if(state.lessons.find(x=>x.id===id)?.closed){toast('الحصة منتهية؛ أعيدي فتحها أولًا');return}const l=state.lessons.find(x=>x.id===id),g=state.groups.find(x=>x.id===l.groupId);const others=state.groups.filter(x=>x.id!==g.id&&Number(x.grade)===Number(g.grade));const groupOpts=others.map(x=>[x.id,groupName(x.id)]);const html=select('المجموعة الأساسية للطالب','sourceGroupId',groupOpts)+select('الطالب','studentId',state.students.filter(s=>s.groupId===others[0]?.id).map(s=>[s.id,s.code+' — '+s.name]))+select('الحصة الأصلية المراد تعويضها (اختياري)','originalLessonId',[['','بدون تحديد'],...state.lessons.filter(x=>x.groupId===others[0]?.id).map(x=>[x.id,x.date+' — '+(x.topic||'حصة')])]);if(!others.length){toast('أضيفي مجموعة أخرى لنفس الصف أولًا حتى يتمكن طلابها من التعويض هنا');return}openModal('إضافة طالب لحصة تعويض',html,async d=>{const student=state.students.find(s=>s.id===d.studentId);if(!student||student.groupId!==d.sourceGroupId)throw Error('اختاري طالبًا من المجموعة المحددة');if(d.originalLessonId&&!state.lessons.some(x=>x.id===d.originalLessonId&&x.groupId===d.sourceGroupId))throw Error('الحصة الأصلية لا تتبع مجموعة الطالب');await setDoc(doc(db,'makeups',l.id+'_'+d.studentId),{...d,targetLessonId:l.id,createdAt:serverTimestamp()})});const source=$('editForm').elements.sourceGroupId,student=$('editForm').elements.studentId,original=$('editForm').elements.originalLessonId;source.onchange=()=>{const gid=source.value;student.innerHTML=options(state.students.filter(s=>s.groupId===gid).map(s=>[s.id,s.code+' — '+s.name]));original.innerHTML=options([['','بدون تحديد'],...state.lessons.filter(x=>x.groupId===gid).map(x=>[x.id,x.date+' — '+(x.topic||'حصة')])])};return}}
async function attendance(sid,status){if(!lessonPick)return;if(state.lessons.find(x=>x.id===lessonPick)?.closed){toast('الحصة منتهية؛ أعيدي فتحها أولًا');return;}try{const ref=doc(db,'attendance',lessonPick+'_'+sid);if(status==='clear')await deleteDoc(ref);else await setDoc(ref,{studentId:sid,lessonId:lessonPick,status,updatedAt:serverTimestamp()});if(status==='present'){const m=state.makeups.find(x=>x.targetLessonId===lessonPick&&x.studentId===sid);if(m?.originalLessonId)await setDoc(doc(db,'attendance',m.originalLessonId+'_'+sid),{studentId:sid,lessonId:m.originalLessonId,status:'makeup',makeupLessonId:lessonPick,updatedAt:serverTimestamp()})}}catch(e){toast('تعذر التسجيل: '+e.message)}}
</script></body></html>
